{{ range $link := hugo.Data.sidebar.links }}
<div class="nav-content">
    <div class="title pole"> {{ $link.title }} </div>
    {{ range $link.items }}
    <a href="{{ .link }}"> {{ .name }}
        <span>
            <svg width="20" height="20" fill="#fff" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round" stroke="#CCCCCC"
                    stroke-width="0.064"></g>
                <g id="SVGRepo_iconCarrier">
                    <path
                        d="M26.025 14.496l-14.286-.001 6.366-6.366L15.979 6 5.975 16.003 15.971 26l2.129-2.129-6.367-6.366h14.29z">
                    </path>
                </g>
            </svg>
        </span>
    </a>
    {{ end }}
</div>
{{ end }}
