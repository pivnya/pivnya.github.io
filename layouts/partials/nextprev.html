{{ if and .IsPage (or .Next .Prev) -}}

{{ $pages := .CurrentSection.Pages.ByWeight }}

<div id="nextprev">
    {{ with $pages.Prev . }}
        <a href="{{ .RelPermalink}}"><div id="prevart">◂ {{.Title}}</div></a>
    {{ end -}}

    {{ with $pages.Next . }}
        <a href="{{ .RelPermalink}}"><div id="nextart">{{.Title}} ▸</div></a>
    {{ end -}}
</div>
{{ end -}}
